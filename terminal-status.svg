<svg width="620" height="330" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="620" height="330" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="620" height="330" fill="url(#winBg)"/>

    <rect x="0" y="0" width="620" height="34" fill="#11111b"/>
    <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="17" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="17" r="6" fill="#a6e3a1"/>
    <text x="310" y="21" fill="#6c7086" font-size="12" text-anchor="middle">lucas@ufv:~</text>

    <g font-size="14">
      <text x="22" y="64" fill="#a6e3a1" opacity="0">
        &gt; lucas.status()
        <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
      </text>

      <text x="22" y="90" fill="#cdd6f4" opacity="0">
        {
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="116" opacity="0">
        <tspan fill="#89b4fa">background</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"Information Systems – UFV"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="142" opacity="0">
        <tspan fill="#89b4fa">goal</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"QA / Quality Assurance"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="168" opacity="0">
        <tspan fill="#89b4fa">building</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"ParkFinder · FastAPI + PostGIS + Expo"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="194" opacity="0">
        <tspan fill="#89b4fa">ai_ml</tspan><tspan fill="#cdd6f4">: [</tspan><tspan fill="#a6e3a1">"PyTorch"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Transformers"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"CNNs"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"RAG"</tspan><tspan fill="#cdd6f4">],</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="220" opacity="0">
        <tspan fill="#89b4fa">testing</tspan><tspan fill="#cdd6f4">: [</tspan><tspan fill="#a6e3a1">"Postman"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Playwright"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Pytest"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Jira"</tspan><tspan fill="#cdd6f4">],</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="246" opacity="0">
        <tspan fill="#89b4fa">mindset</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"test it before trusting it"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="42" y="272" opacity="0">
        <tspan fill="#89b4fa">off_duty</tspan><tspan fill="#cdd6f4">: [</tspan><tspan fill="#a6e3a1">"Flamengo"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"futsal"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"games"</tspan><tspan fill="#cdd6f4">]</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.3s" fill="freeze"/>
      </text>

      <text x="22" y="298" fill="#cdd6f4" opacity="0">
        }
        <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.3s" fill="freeze"/>
      </text>

      <rect x="34" y="285" width="9" height="16" fill="#f5c2e7" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.5;0.55;1" begin="4.7s" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="619" height="329" rx="14" fill="none" stroke="#313244" stroke-width="1"/>
</svg>
