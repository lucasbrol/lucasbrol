<svg width="620" height="290" viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="620" height="290" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="620" height="290" fill="url(#winBg)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="620" height="34" fill="#11111b"/>
    <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="17" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="17" r="6" fill="#a6e3a1"/>
    <text x="310" y="21" fill="#6c7086" font-size="12" text-anchor="middle">lucas@ufv:~</text>

    <!-- body -->
    <g font-size="14.5">
      <text x="22" y="64" fill="#a6e3a1">
        &gt; lucas.status()
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.08" dur="8s" begin="0s;t0.end" fill="freeze"/>
      </text>

      <g id="t0">
        <animate id="dummy0" attributeName="opacity" values="1" dur="8s" begin="0s" fill="freeze"/>
      </g>

      <text x="22" y="92" fill="#cdd6f4" opacity="0">
        {
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.10;0.16" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <text x="42" y="118" opacity="0">
        <tspan fill="#89b4fa">background</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"Information Systems – UFV"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.18;0.26" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <text x="42" y="144" opacity="0">
        <tspan fill="#89b4fa">goal</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#f9e2af">"QA / Quality Assurance"</tspan><tspan fill="#cdd6f4">,</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.28;0.36" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <text x="42" y="170" opacity="0">
        <tspan fill="#89b4fa">learning</tspan><tspan fill="#cdd6f4">: [</tspan><tspan fill="#a6e3a1">"Postman"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"SQL"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Jira"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Python"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"C"</tspan><tspan fill="#cdd6f4">],</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.38;0.48" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <text x="42" y="196" opacity="0">
        <tspan fill="#89b4fa">off_duty</tspan><tspan fill="#cdd6f4">: [</tspan><tspan fill="#a6e3a1">"football"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"a bit of The Witcher"</tspan><tspan fill="#cdd6f4">]</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.50;0.58" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <text x="22" y="222" fill="#cdd6f4" opacity="0">
        }
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.60;0.64" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </text>

      <!-- blinking cursor -->
      <rect x="34" y="208" width="9" height="16" fill="#f5c2e7" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.62;0.65;0.70;0.75;0.80;0.85;0.90;0.95;1" dur="8s" begin="0s" fill="freeze" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="619" height="289" rx="14" fill="none" stroke="#313244" stroke-width="1"/>
</svg>
